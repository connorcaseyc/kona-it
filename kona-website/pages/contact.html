<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Describe your page here" />
		<title>Contact KONA IT Advisors</title>
		<link rel="stylesheet" href="../styles/styles.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="services-primary-container">
			<div id="navbar">
				<nav>
					<div id="nav-container">
						<div id="logo">
							<img
								src="../assets/black-wide-white-bg.PNG"
								alt="KONA-logo"
							/>
						</div>
						<div id="nav-links">
							<ul>
								<li><a href="../index.html">Home</a></li>
								<li><a href="../pages/contact.html">Contact</a></li>
								<li><a href="../pages/about.html">About</a></li>
							</ul>
						</div>
					</div>
				</nav>
			</div>

			<div id="main-page-content-container">
				<main>
					<div id="main-page-content">
						<div id="contact-us-detailed">
							<h1>Contact KONA IT Services</h1>
							<p>
								If you have any questions or would like to get in touch,
								please fill out the form below:
							</p>

							<div id="contact-form">
								<h3>Contact Us</h3>
								<form>
									<label for="name">Name:</label>
									<input type="text" id="name" name="name" required />

									<label for="email">Email:</label>
									<input
										type="email"
										id="email"
										name="email"
										required
									/>

									<label for="message">Message:</label>
									<textarea
										id="message"
										name="message"
										required
									></textarea>

									<button type="submit">Submit</button>
								</form>
							</div>
						</div>
					</div>
				</main>
			</div>

			<div id="footer-container">
				<footer>
					<span>
						Kona IT Advisors
						<small>&copy; 2026</small>
					</span>
				</footer>
			</div>
		</div>
	</body>
</html>
